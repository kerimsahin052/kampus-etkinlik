<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Etkinlik Ekle</title>

    <link rel="stylesheet" href="css/2416501039.css">
</head>

<body>

<header>
    <h1>Etkinlik Ekle</h1>
</header>

<nav>
    <a href="index.html">Ana Sayfa</a>
    <a href="etkinlikler.html">Etkinlikler</a>
    <a href="etkinlik-ekle.html">Ekle</a>
    <a href="etkinlik-guncelle.html">Güncelle</a>
</nav>

<main>

    <form>

        <div>
            <label for="etkinlik-adi">
                Etkinlik Adı
            </label>

            <input
                type="text"
                id="etkinlik-adi"
                name="etkinlik-adi"
                placeholder="Etkinlik adını giriniz"
                required>
        </div>


        <div>
            <label for="kategori">
                Kategori
            </label>

            <select
                id="kategori"
                name="kategori"
                required>

                <option value="">
                    Seçiniz
                </option>

                <option value="seminer">
                    Seminer
                </option>

                <option value="atolye">
                    Atölye
                </option>

                <option value="soylesi">
                    Söyleşi
                </option>

            </select>
        </div>


        <div>
            <label for="tarih">
                Tarih
            </label>

            <input
                type="datetime-local"
                id="tarih"
                name="tarih"
                required>
        </div>


        <div>
            <label for="aciklama">
                Açıklama
            </label>

            <textarea
                id="aciklama"
                name="aciklama"
                placeholder="Etkinlik açıklamasını giriniz"
                required></textarea>
        </div>


        <button type="submit">
            Kaydet
        </button>

    </form>

</main>

<footer>
    <p>Muhammed Kerim Şahin - 2416501039 - 2026</p>
</footer>

</body>
</html>
