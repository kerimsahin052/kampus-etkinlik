<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Etkinlik Ekle</title>
</head>

<body>

    <header>
        <h1>Etkinlik Ekle</h1>
    </header>

    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik-detay.html">Detay</a>
        <a href="etkinlik-ekle.html">Ekle</a>
    </nav>

    <main>

        <form>

            <p>
                <label for="etkinlik-adi">Etkinlik Adı</label><br>

                <input
                    type="text"
                    id="etkinlik-adi"
                    name="etkinlik-adi"
                    required>
            </p>

            <p>
                <label for="kategori">Kategori</label><br>

                <select
                    id="kategori"
                    name="kategori"
                    required>

                    <option value="seminer">Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="konferans">Konferans</option>

                </select>
            </p>

            <p>
                <label for="tarih-saat">Tarih / Saat</label><br>

                <input
                    type="datetime-local"
                    id="tarih-saat"
                    name="tarih-saat"
                    required>
            </p>

            <p>
                <label for="aciklama">Açıklama</label><br>

                <textarea
                    id="aciklama"
                    name="aciklama"
                    rows="4"
                    cols="40"
                    required></textarea>
            </p>

            <button type="submit">Kaydet</button>

        </form>

    </main>

    <footer>
        <p>Ad Soyad - Öğrenci No - 2026</p>
    </footer>

</body>

</html>
